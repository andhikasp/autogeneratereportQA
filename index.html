<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QA Report Generator Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,600;1,9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #f0f4ff;
      --bg2:      #e6ecff;
      --card:     #ffffff;
      --card2:    #f7f9ff;
      --border:   #d4dcf7;
      --border2:  #b0bef0;
      --text:     #1a1d36;
      --text2:    #4a517a;
      --text3:    #8b92b8;
      --accent:   #4f46e5;
      --accent-g: rgba(79,70,229,.15);
      --success:  #059669; --success-b:#d1fae5;
      --warn:     #d97706; --warn-b:  #fef3c7;
      --danger:   #dc2626; --danger-b: #fee2e2;
      --info:     #0284c7; --info-b:  #e0f2fe;
      --purple-b: #ede9fe;
      --font:     'DM Sans', sans-serif;
      --mono:     'DM Mono', monospace;
      --r:        8px; --r2: 12px;
      --shadow:   0 1px 3px rgba(79,70,229,.08), 0 4px 16px rgba(79,70,229,.06);
    }

    body { font-family: var(--font); background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; }

    /* LAYOUT: SIDEBAR & MAIN */
    .sidebar {
      width: 280px; background: var(--card); border-right: 1.5px solid var(--border);
      display: flex; flex-direction: column; z-index: 10;
    }
    
    .sidebar-header { padding: 1.25rem; border-bottom: 1.5px solid var(--border); }
    .sidebar-header h2 { font-size: 15px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }
    .sidebar-header h2::before { content:''; width:8px; height:8px; background:var(--accent); border-radius:50%; }
    
    .new-task-btn {
      width: 100%; margin-top: 1rem; padding: 10px; font-size: 13px; font-weight: 600;
      background: var(--purple-b); color: var(--accent); border: 1.5px dashed var(--accent);
      border-radius: var(--r); cursor: pointer; transition: all .2s; font-family: var(--font);
    }
    .new-task-btn:hover { background: var(--accent); color: #fff; }

    .task-list { flex: 1; overflow-y: auto; padding: 1rem; }
    .task-item {
      padding: 12px; border-radius: var(--r); margin-bottom: 8px; cursor: pointer;
      border: 1.5px solid transparent; background: var(--card2); transition: all .2s;
      position: relative;
    }
    .task-item:hover { border-color: var(--border2); }
    .task-item.active { background: #fff; border-color: var(--accent); box-shadow: 0 4px 12px var(--accent-g); }
    .task-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 20px;}
    .task-date { font-size: 11px; color: var(--text3); }
    
    .delete-task {
      position: absolute; right: 10px; top: 12px; color: var(--text3); font-size: 14px;
      cursor: pointer; opacity: 0; transition: opacity .2s;
    }
    .task-item:hover .delete-task { opacity: 1; }
    .delete-task:hover { color: var(--danger); }

    .main-content {
      flex: 1; overflow-y: auto; position: relative; padding: 2rem; scroll-behavior: smooth;
    }
    .main-content::before {
      content: ''; position: fixed; inset: 0; left: 280px;
      background-image: linear-gradient(rgba(79,70,229,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(79,70,229,.035) 1px, transparent 1px);
      background-size: 36px 36px; pointer-events: none; z-index: 0;
    }
    .container { max-width: 760px; margin: 0 auto; position: relative; z-index: 1; padding-bottom: 4rem;}

    /* CARDS & FIELDS */
    .step-label { font-size: 11px; font-weight: 700; letter-spacing:.08em; text-transform: uppercase; color: var(--text3); margin-bottom: .75rem; padding-bottom: .5rem; border-bottom: 1.5px solid var(--border); display: flex; align-items: center; gap: 8px; margin-top: 2rem;}
    .step-label::before { content: attr(data-n); font-size: 9px; background: var(--accent); color: #fff; border-radius: 5px; padding: 2px 6px; }
    .step-label:first-child { margin-top: 0; }

    .card { background: var(--card); border: 1.5px solid var(--border); border-radius: var(--r2); padding: 1.5rem; box-shadow: var(--shadow); }
    .field { margin-bottom: 1rem; } .field:last-child { margin-bottom: 0; }
    .field label { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text2); margin-bottom: 6px; font-weight: 600; }
    .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
    
    input[type="text"], input[type="date"], input[type="time"], input[type="number"], select, textarea {
      width: 100%; background: var(--card2); border: 1.5px solid var(--border); border-radius: var(--r); padding: 10px 12px;
      font-size: 13.5px; color: var(--text); font-family: var(--font); transition: all .2s; outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px var(--accent-g); }
    textarea { resize: vertical; min-height: 80px; line-height: 1.6; }
    
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

    /* CHECKLIST TOGGLE UI */
    .ch-builder { display: flex; gap: 8px; margin-bottom: 12px; }
    .ch-add-btn { padding: 0 16px; background: var(--text); color: white; border: none; border-radius: var(--r); font-weight: 600; cursor: pointer; font-family: var(--font); }
    .ch-list { display: flex; flex-direction: column; gap: 6px; }
    .ch-item { display: flex; align-items: center; gap: 10px; background: var(--card2); padding: 8px 12px; border-radius: var(--r); border: 1.5px solid var(--border); }
    .ch-text { flex: 1; font-size: 13.5px; }
    .ch-toggle { 
      padding: 4px 10px; font-size: 13px; border-radius: 6px; border: none; cursor: pointer; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.1); transition: transform .1s;
    }
    .ch-toggle:active { transform: scale(0.95); }
    .ch-del { color: var(--text3); cursor: pointer; font-size: 16px; background: none; border: none; padding: 0 4px; }
    .ch-del:hover { color: var(--danger); }

    /* BUTTONS */
    .btn-row { display: flex; gap: 12px; margin-top: 2rem; }
    .gen-btn { padding: 14px 24px; font-size: 14.5px; font-weight: 600; border-radius: var(--r2); cursor: pointer; background: linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%); border: none; color: #fff; box-shadow: 0 4px 16px rgba(79,70,229,.3); font-family: var(--font); flex: 1;}
    .gen-btn:hover { opacity:.92; transform: translateY(-1px); }
    
    /* RESULT TABS */
    .result-box { margin-top: 2rem; display: none; }
    .tab-row { display: flex; gap: 8px; margin-bottom: 1rem; overflow-x: auto; padding-bottom: 4px;}
    .t-btn { padding: 8px 16px; font-size: 13px; font-weight: 600; border-radius: 20px; cursor: pointer; border: 1.5px solid var(--border); background: var(--card); color: var(--text3); transition: all .2s; font-family: var(--font); white-space: nowrap;}
    .t-btn:hover { color: var(--text2); border-color: var(--border2); }
    .t-btn.active { border-color: var(--accent); color: var(--accent); background: var(--purple-b); }

    .out-card { background: var(--card); border: 1.5px solid var(--border); border-radius: var(--r2); padding: 1.5rem; position: relative; box-shadow: var(--shadow); }
    .copy-btn { position: absolute; top: 1.25rem; right: 1.25rem; padding: 6px 14px; font-size: 12px; font-weight: 600; border-radius: 8px; cursor: pointer; border: 1.5px solid var(--accent); background: var(--purple-b); color: var(--accent); transition: all .15s; font-family: var(--font); }
    .copy-btn:hover { background: var(--accent); color: #fff; }
    .report-text { font-family: var(--mono); font-size: 12.5px; color: var(--text); white-space: pre-wrap; line-height: 1.7; padding-top: 2rem; }

    /* TOAST */
    .toast { position: fixed; bottom: 2rem; right: 2rem; background: var(--text); color: #fff; font-size: 13.5px; font-weight: 500; padding: 12px 20px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.15); opacity: 0; transform: translateY(10px); transition: all .3s; pointer-events: none; z-index: 999; }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <h2>QA Workspace</h2>
    <button class="new-task-btn" onclick="createNewTask()">+ Buat Task Baru</button>
  </div>
  <div class="task-list" id="task-list-container">
    </div>
</div>

<div class="main-content">
  <div class="container">
    
    <div class="step-label" data-n="01">Info Proyek & Sistem</div>
    <div class="card">
      <div class="row2">
        <div class="field"><label><span class="dot"></span>Nama Aplikasi</label><input type="text" id="app_name" placeholder="EFS Modul FPSL Technical" /></div>
        <div class="field"><label><span class="dot"></span>Nama Project</label><input type="text" id="project_name" placeholder="EFS-Technical-N-2026-002..." /></div>
      </div>
      <div class="row2">
        <div class="field"><label>Link Jira</label><input type="text" id="jira_link" placeholder="https://jira.bri.co.id/browse/..." /></div>
        <div class="field"><label>Link iRIS</label><input type="text" id="iris_link" placeholder="https://iris.bri.co.id/HEAT/..." /></div>
      </div>
      <div class="row2">
        <div class="field"><label>No. Tiket NCM</label><input type="text" id="ticket_no" placeholder="NCM2605..." /></div>
        <div class="field"><label>Kategori (Metode)</label><input type="text" id="category" placeholder="Waterfall / Agile" /></div>
      </div>
      <div class="row2">
        <div class="field"><label>Tipe Deploy</label><input type="text" id="type" placeholder="Rollout / Hotfix" /></div>
        <div class="field"><label>Criticality</label><select id="criticality"><option>Low</option><option selected>Medium</option><option>High</option></select></div>
      </div>
    </div>

    <div class="step-label" data-n="02">Scope Pengembangan</div>
    <div class="card">
      <div class="field"><label>1. Latar Belakang</label><textarea id="background" placeholder="Pengelolaan user dan role di SAP saat ini masih..."></textarea></div>
      <div class="field"><label>2. Tujuan Perubahan</label><textarea id="purpose" placeholder="Integrasi SAP-IDM bertujuan untuk..."></textarea></div>
      <div class="field"><label>3. Outcome</label><textarea id="outcome" placeholder="Proses pengelolaan akses user menjadi lebih cepat..."></textarea></div>
    </div>

    <div class="step-label" data-n="03">Tanggal & Waktu</div>
    <div class="card">
      <div class="row3">
        <div class="field"><label>Tanggal SIT</label><input type="date" id="sit_date" /></div>
        <div class="field"><label>Tanggal UAT</label><input type="date" id="uat_date" /></div>
        <div class="field"><label>Rencana Deploy</label><input type="date" id="deploy_date" /></div>
      </div>
      <div class="row2">
        <div class="field"><label>Start Time Deploy</label><input type="time" id="start_time" /></div>
        <div class="field"><label>End Time Deploy</label><input type="time" id="end_time" /></div>
      </div>
    </div>

    <div class="step-label" data-n="04">Test Case & Aktivitas</div>
    <div class="card">
      <div class="row3">
        <div class="field"><label>Total TC SIT/UAT</label><input type="number" id="tc_total" value="0" /></div>
        <div class="field"><label>Happy Flow Count</label><input type="number" id="tc_happy" value="0" /></div>
        <div class="field"><label>Unhappy Flow Count</label><input type="number" id="tc_unhappy" value="0" /></div>
      </div>
      <div class="row3" style="margin-top:-10px; margin-bottom:15px;">
        <div class="field"><label>Defect Count</label><input type="number" id="tc_defect" value="0" /></div>
        <div class="field"><label>TC Regresi</label><input type="text" id="tc_regresi" value="-" placeholder="0 / -" /></div>
      </div>
      
      <div class="field" style="border-top: 1.5px solid var(--border); padding-top: 15px;">
        <label><span class="dot"></span>Data Preparation (SIT/UAT)</label>
        <textarea id="data_prep" placeholder="> Data Dummy User Management IDM ✅"></textarea>
      </div>
      
      <div class="field" style="border-top: 1.5px dashed var(--border); padding-top: 15px; margin-top: 15px;">
        <label><span class="dot"></span>Checklist Deployment Test (Happy Flow)</label>
        <div class="ch-builder">
          <input type="text" id="ch_input" placeholder="Ketik aktivitas (ex: Fetch Data User) lalu Enter" onkeypress="if(event.key==='Enter') addChecklist()" />
          <button class="ch-add-btn" onclick="addChecklist()">Add</button>
        </div>
        <div class="ch-list" id="checklist_container"></div>
      </div>

      <div class="field" style="margin-top: 15px;">
        <label>List Detail TC (Opsional untuk Readiness)</label>
        <textarea id="tc_details" placeholder="1. [MFA][Joiner] Fetch New User...&#10;2. [MFA][Joiner] Role Tab is Empty..." style="min-height: 120px;"></textarea>
      </div>
    </div>

    <div class="step-label" data-n="05">PIC & Status Deploy</div>
    <div class="card">
      <div class="row2">
        <div class="field"><label>Fungsi QA</label><input type="text" id="fungsi_qa" value="QA_QFN" /></div>
        <div class="field"><label>Test Lead</label><input type="text" id="pic_tl" placeholder="Nama (Kode/Divisi)" /></div>
      </div>
      <div class="row2">
        <div class="field"><label>Tester</label><input type="text" id="pic_tester" value="Andhika Surya Putra (APS/QFN)" /></div>
        <div class="field"><label>PO / User</label><input type="text" id="pic_po" placeholder="Nama (Kode/Divisi)" /></div>
      </div>
      <div class="row2">
        <div class="field"><label>Dev</label><input type="text" id="pic_dev" placeholder="Nama (Divisi)" /></div>
        <div class="field"><label>Ops</label><input type="text" id="pic_ops" placeholder="Nama (Divisi)" /></div>
      </div>
      
      <div class="field" style="border-top: 1.5px solid var(--border); padding-top: 15px;">
        <label>Status Deploy Saat Ini</label>
        <select id="deploy_status">
          <option value="In Progress ⌛️">In Progress ⌛️</option>
          <option value="Done ✅">Done ✅</option>
          <option value="Failed ❌">Failed ❌</option>
        </select>
      </div>
      <div class="field"><label>Notes / Keterangan</label><textarea id="notes" placeholder="Menunggu Hasil Background Job pada pagi hari..."></textarea></div>
    </div>

    <div class="btn-row">
      <button class="gen-btn" onclick="generateReport()">Buka Laporan Ter-Generate 📄</button>
    </div>

    <div class="result-box" id="result-box">
      <div class="tab-row">
        <button class="t-btn active" onclick="showTab(0)">Deploy Test Report</button>
        <button class="t-btn" onclick="showTab(1)">Aktivitas Testing</button>
        <button class="t-btn" onclick="showTab(2)">Readiness Report</button>
      </div>
      <div class="out-card">
        <button class="copy-btn" id="copy-btn" onclick="copyReport()">Salin Text</button>
        <div class="report-text" id="report-content"></div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// --- STATE MANAGEMENT ---
const STORE_KEY = 'qa_workspace_v2';
let state = {
  activeTaskId: null,
  tasks: []
};

// Field dasar HTML yang langsung di-bind ke Object
const BIND_FIELDS = [
  'app_name','project_name','jira_link','iris_link','ticket_no','category','type','criticality',
  'background','purpose','outcome','sit_date','uat_date','deploy_date','start_time','end_time',
  'tc_total','tc_happy','tc_unhappy','tc_defect','tc_regresi','data_prep','tc_details',
  'fungsi_qa','pic_tl','pic_tester','pic_po','pic_dev','pic_ops','deploy_status','notes'
];

let generatedReports = ['','',''];
let currentTab = 0;

// --- INITIALIZATION ---
function init() {
  loadData();
  if (state.tasks.length === 0) {
    createNewTask();
  } else {
    if (!state.activeTaskId) state.activeTaskId = state.tasks[0].id;
    renderSidebar();
    loadTaskToForm(state.activeTaskId);
  }

  // Setup Autosave Listeners
  BIND_FIELDS.forEach(id => {
    const el = document.getElementById(id);
    if(el) el.addEventListener('input', () => {
      saveActiveTaskData();
      renderSidebar(); // Update judul di sidebar live
    });
  });
}

function saveData() {
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) state = JSON.parse(raw);
  } catch(e) { console.error("Cache error", e); }
}

// --- TASK MANAGEMENT (SIDEBAR) ---
function createNewTask() {
  const newId = 'task_' + Date.now();
  const newTask = {
    id: newId,
    created: new Date().toISOString(),
    checklist: [], // Array of {text: '', status: '⌛️'}
    data: {}       // Store BIND_FIELDS here
  };
  
  // Set default values for new task
  BIND_FIELDS.forEach(f => {
    const el = document.getElementById(f);
    newTask.data[f] = el ? (el.getAttribute('value') || '') : '';
  });

  state.tasks.unshift(newTask); // Taruh di atas
  switchTask(newId);
  showToast('Task baru dibuat 📝');
}

function switchTask(taskId) {
  saveActiveTaskData(); // Simpan form saat ini dulu
  state.activeTaskId = taskId;
  loadTaskToForm(taskId);
  renderSidebar();
  document.getElementById('result-box').style.display = 'none';
}

function deleteTask(taskId, event) {
  event.stopPropagation();
  if(!confirm('Hapus task ini?')) return;
  
  state.tasks = state.tasks.filter(t => t.id !== taskId);
  if(state.tasks.length === 0) {
    createNewTask();
  } else {
    if(state.activeTaskId === taskId) switchTask(state.tasks[0].id);
    else renderSidebar();
  }
  saveData();
}

function renderSidebar() {
  const container = document.getElementById('task-list-container');
  container.innerHTML = '';
  
  state.tasks.forEach(task => {
    const title = task.data.app_name || task.data.project_name || 'Draft Baru';
    const dateStr = new Date(task.created).toLocaleDateString('id-ID', {day:'numeric', month:'short'});
    
    const div = document.createElement('div');
    div.className = `task-item ${task.id === state.activeTaskId ? 'active' : ''}`;
    div.onclick = () => switchTask(task.id);
    div.innerHTML = `
      <div class="task-title">${title}</div>
      <div class="task-date">Dibuat: ${dateStr}</div>
      <button class="delete-task" onclick="deleteTask('${task.id}', event)">✖</button>
    `;
    container.appendChild(div);
  });
}

// --- FORM SYNCING ---
function saveActiveTaskData() {
  if(!state.activeTaskId) return;
  const task = state.tasks.find(t => t.id === state.activeTaskId);
  if(!task) return;
  
  BIND_FIELDS.forEach(id => {
    const el = document.getElementById(id);
    if(el) task.data[id] = el.value;
  });
  saveData();
}

function loadTaskToForm(taskId) {
  const task = state.tasks.find(t => t.id === taskId);
  if(!task) return;
  
  BIND_FIELDS.forEach(id => {
    const el = document.getElementById(id);
    if(el && task.data[id] !== undefined) el.value = task.data[id];
  });
  
  renderChecklistUI();
}

// --- CHECKLIST FEATURE ---
function addChecklist() {
  const input = document.getElementById('ch_input');
  const text = input.value.trim();
  if(!text) return;
  
  const task = state.tasks.find(t => t.id === state.activeTaskId);
  task.checklist.push({ text: text, status: '⌛️' });
  input.value = '';
  
  saveData();
  renderChecklistUI();
}

function toggleStatus(index) {
  const task = state.tasks.find(t => t.id === state.activeTaskId);
  const current = task.checklist[index].status;
  
  // Cycle: ⌛️ -> ✅ -> ❌ -> ⌛️
  if(current === '⌛️') task.checklist[index].status = '✅';
  else if(current === '✅') task.checklist[index].status = '❌';
  else task.checklist[index].status = '⌛️';
  
  saveData();
  renderChecklistUI();
}

function removeChecklist(index) {
  const task = state.tasks.find(t => t.id === state.activeTaskId);
  task.checklist.splice(index, 1);
  saveData();
  renderChecklistUI();
}

function renderChecklistUI() {
  const task = state.tasks.find(t => t.id === state.activeTaskId);
  const container = document.getElementById('checklist_container');
  container.innerHTML = '';
  
  if(!task || !task.checklist) return;
  
  task.checklist.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'ch-item';
    div.innerHTML = `
      <div class="ch-text">${idx+1}. ${item.text}</div>
      <button class="ch-toggle" onclick="toggleStatus(${idx})">${item.status}</button>
      <button class="ch-del" onclick="removeChecklist(${idx})">×</button>
    `;
    container.appendChild(div);
  });
}

// --- UTILS & FORMATTERS ---
function g(id) { return document.getElementById(id).value.trim(); }
function fmtDate(d) {
  if (!d) return '-';
  const [y,m,day] = d.split('-');
  return `${day}-${m}-${y}`; // DD-MM-YYYY
}
function fmtDateIDM(d) {
  if (!d) return '-';
  const dateObj = new Date(d);
  return dateObj.toLocaleDateString('id-ID', { day: '2-digit', month: 'long' }); // 08 Mei
}
function lines(text) { return text ? text.split('\n').map(l=>l.trim()).filter(Boolean) : []; }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// --- GENERATOR ENGINE ---
function generateReport() {
  saveActiveTaskData();
  const task = state.tasks.find(t => t.id === state.activeTaskId);
  const d = task.data;
  
  // Waktu saat generate
  const now = new Date();
  const tsYMD = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');

// --- TAB NAVIGATION ---
const tabLabels = ['Deploy Test Report', 'Update Report Aktivitas Testing', 'Deployment Readiness Report'];

function showTab(i) {
  currentTab = i;
  document.querySelectorAll('.t-btn').forEach((b,idx) => b.className = 't-btn'+(idx===i?' active':''));
  document.getElementById('report-content').textContent = generatedReports[i];
  const cb = document.getElementById('copy-btn');
  cb.textContent = 'Salin Text'; cb.style.background = 'var(--purple-b)'; cb.style.color = 'var(--accent)';
}

function copyReport() {
  navigator.clipboard.writeText(generatedReports[currentTab]).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = '✓ Tersalin!'; btn.style.background = 'var(--success-b)'; btn.style.color = 'var(--success)';
    setTimeout(() => { btn.textContent = 'Salin Text'; btn.style.background = 'var(--purple-b)'; btn.style.color = 'var(--accent)'; }, 2000);
  });
}

// Start Engine
